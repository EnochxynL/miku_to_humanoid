[project]
name = "miku-to-humanoid"
version = "0.1.0"
description = "MMD (PMX + VMD/VPD) motion retargeting onto humanoid robots: calibrate the frame correspondence from a paired pose, then hand the motion to GMR"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "mujoco>=3.2",     # source-side MJCF for rendering, and the robot FK used to read C
    "pillow>=10.0",    # PMX textures are bmp/tga/jpg; they are normalised to PNG
]
license = "MIT"
authors = [{name = "Yinuo Xie"}]

[project.scripts]
mmdmr-gui = "mmdmr.gui:main"
mmdmr-calibration = "mmdmr.calibration:main"
mmdmr-retarget = "mmdmr.retarget:main"
mmdmr-view = "mmdmr.view:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmdmr"]

# GMR is a separate checkout, not a PyPI package: the retarget step imports
# ``general_motion_retargeting`` and therefore has to run inside GMR's own environment. The GUI does that
# for you; from a shell, point --gmr-root at the checkout.
